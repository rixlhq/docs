pre-commit:
  parallel: true
  commands:
    check:
      glob: "*.{js,ts,jsx,tsx}"
      run: vp check --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.{json,md,yaml,yml,css}"
      run: vp fmt --write {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    build:
      glob:
        - "**/*.{js,ts,jsx,tsx}"
        - "content/**"
      run: vp build
