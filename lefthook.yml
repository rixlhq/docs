pre-commit:
  parallel: true
  commands:
    check:
      glob:
        - "*.{js,ts,jsx,tsx}"
        - "*.{json,md,yaml,yml,css}"
      run: vp check --fix {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    build:
      glob:
        - "**/*.{js,ts,jsx,tsx}"
        - "content/**"
      run: vp build
