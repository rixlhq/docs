# Run the lefthook pinned in package.json, not a global install, so every
# machine runs the same hook version.
lefthook: node_modules/.bin/lefthook
min_version: 2.2.2

pre-commit:
  # In order, stopping at the first failure: the fixes land before the tests read the files.
  piped: true
  commands:
    check:
      glob:
        - "*.{js,ts,jsx,tsx}"
        - "*.{json,md,yaml,yml,css}"
      run: vp check --fix {staged_files}
      stage_fixed: true
    suppressions:
      glob: "*.{ts,tsx}"
      run: vp run lint:suppressions
    test:
      glob: "*.{ts,tsx}"
      # Tests that import the staged files. A stuck run fails the commit instead of hanging it.
      run: vp test related {staged_files} --run --bail=1
      timeout: 2m
    actions:
      glob: ".github/actions/cloudflare/**"
      # The rollout and Sentry gate scripts, with wrangler, sleep and Sentry stubbed.
      run: vp run test:actions
      timeout: 2m

pre-push:
  parallel: true
  commands:
    build:
      glob:
        - "**/*.{js,ts,jsx,tsx}"
        - "content/**"
      run: vp build
    knip:
      run: vp run knip
