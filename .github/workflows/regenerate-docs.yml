name: Regenerate Docs

on:
  repository_dispatch:
    types:
      - regenerate-docs
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  create-bump-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create bump PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="openapi-regenerate-${{ github.run_id }}"
          git checkout -b "$branch"
          git commit --allow-empty -m "chore: trigger docs rebuild for openapi update"
          git push origin "$branch"
          gh api "repos/${{ github.repository }}/pulls" \
            -f title="chore: trigger docs rebuild for openapi update" \
            -f body="The OpenAPI spec was updated on the main branch. Merge this PR to rebuild and redeploy the docs." \
            -f head="$branch" \
            -f base="main"
