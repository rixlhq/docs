name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      pull-requests: write # coverage report comment
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true

      - name: 🎭 Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: ⚙️ Setup Playwright OS dependencies
        run: vpx playwright install-deps chromium

      - name: ⚙️ Setup Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: vpx playwright install chromium

      - parallel:
          - name: 🧩 Check
            run: vp check

          - name: 🔍 Dead code
            run: vp run knip

          - name: 🚫 Lint suppressions
            run: vp run lint:suppressions

          - name: 🧪 Action tests
            run: vp run test:actions

          - name: 🛠️ Build
            run: vpr build
            env:
              VITE_SENTRY_DSN: ${{ github.ref == 'refs/heads/main' && vars.SENTRY_DSN || '' }}
              SENTRY_ORG: ${{ vars.SENTRY_ORG }}
              SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
              SENTRY_URL: ${{ vars.SENTRY_URL }}
              SENTRY_AUTH_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}

      # After the build, not beside it: build and test conflict when run in parallel (as in mediasdk).
      - name: 🧪 Test
        run: vp test --coverage

      - name: 📊 Report coverage to PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: davelosert/vitest-coverage-report-action@v2

      - name: 🚀 Deploy to CF
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: preview

      - name: 🏷️ Version tag
        if: github.ref == 'refs/heads/main'
        run: echo "VERSION_TAG=${GITHUB_SHA:0:12}" >> "${GITHUB_ENV}"

      - name: 📤 Upload version
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --tag ${{ env.VERSION_TAG }} --message "main ${{ env.VERSION_TAG }}"
