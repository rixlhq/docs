name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true

      # Check before Build, not beside it: the build rewrites src/paraglide,
      # src/routeTree.gen.ts and the MDX sources that Check type-checks, so
      # side by side Check could read a half-written file.
      - name: 🧩 Check
        run: vp check

      - name: 🛠️ Build
        run: vpr build
        # Sentry only in the build that ships (main): the release is named
        # after this commit, which the rollout's Sentry gate looks up. PR
        # previews get no DSN, so they never report into production.
        # Same SENTRY_AUTH_TOKEN the rollout's gate reads with; it uploads
        # the source maps.
        env:
          VITE_SENTRY_DSN: ${{ github.ref == 'refs/heads/main' && vars.SENTRY_DSN || '' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_URL: ${{ vars.SENTRY_URL }}
          SENTRY_AUTH_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.SENTRY_AUTH_TOKEN || '' }}

      - name: 🚀 Deploy to CF
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: preview

      - name: 🏷️ Version tag
        if: github.ref == 'refs/heads/main'
        run: echo "VERSION_TAG=${GITHUB_SHA:0:12}" >> "${GITHUB_ENV}"

      - name: 📤 Upload version
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --tag ${{ env.VERSION_TAG }} --message "main ${{ env.VERSION_TAG }}"
